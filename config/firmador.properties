# Configuración del escritorio KMP (solo this machine; sin secretos)
# Se puede sobrescribir con -Dfirmador.<clave>=... o variables FIRMADOR_<CLAVE>.

firmador.api.base.url=http://localhost:8000
# Ruta nueva y definitiva del endpoint de datos del recibo.
firmador.api.recibo.ruta=/devolucion/generar/desktop/recibo/{codigo}
# Ruta vieja, solo como alternativa si un entorno aún no se actualizó.
firmador.api.recibo.ruta.alternativa=/devolucion/generar/recibo/{codigo}
firmador.api.firmar.ruta=/devoluciones/recibos/firmar

# Código usado por defecto en la pantalla de firma avanzada.
firmador.codigo=6B1E-144A-749B
# El deep link firmaapp://firmar?id=<codigo>&token=<token> sobrescribe estas
# dos claves automáticamente. No guardar el token en este archivo.
firmador.token=

# Plantilla y sello. Si están vacías se buscan en los recursos de desktopApp.
firmador.pdf.plantilla=
firmador.pdf.sello=
firmador.recibos.dir=recibos_firmados
firmador.sqlite=firmas.db

# Firma avanzada: si se deja vacío se usa ~/apiaApplet.cfg o PKCS11_LIBRARY.
firmador.pkcs11.library=
# Solo para pruebas: si se deja vacío el PIN se pide al móvil por AOA.
# Mejor usar FIRMADOR_PIN_LOCAL para no guardarlo en el archivo.
firmador.pin.local=

# Servidor TCP para que PHP consulte la firma guardada en SQLite.
firmador.tcp.habilitado=true
firmador.tcp.puerto=5500

# AOA (USB) con el móvil de captura.
firmador.usb.habilitado=true
